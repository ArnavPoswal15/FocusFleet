# Mirrors Docker Space layout to Hugging Face on push to main.
# Add repository secret HF_TOKEN (write token): https://huggingface.co/settings/tokens

name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "focusfleet/**"
      - "backend/**"
      - "frontend/**"
      - "web/**"
      - "runtime-assets/**"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "scripts/sync-huggingface-space.sh"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::Set repository secret HF_TOKEN (Hugging Face write token)."
            exit 1
          fi

      - name: Clone Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://ArnavPoswal15:${HF_TOKEN}@huggingface.co/spaces/ArnavPoswal15/FocusFleet" hf-space

      - name: Sync monorepo to Space (Docker layout)
        run: |
          set -euo pipefail
          mkdir -p hf-space/runtime-assets

          RSYNC_EXCLUDES=(
            --exclude='.git/'
            --exclude='__pycache__/'
            --exclude='.DS_Store'
            --exclude='venv/'
            --exclude='*.code-workspace'
            --exclude='.hf-sync-meta.json'
            --exclude='node_modules/'
            --exclude='.next/'
            --exclude='out/'
          )

          rsync -av "${RSYNC_EXCLUDES[@]}" focusfleet/ hf-space/focusfleet/
          rsync -av "${RSYNC_EXCLUDES[@]}" backend/ hf-space/backend/
          rsync -av "${RSYNC_EXCLUDES[@]}" frontend/ hf-space/frontend/
          rsync -av Dockerfile docker-entrypoint.sh hf-space/

          if [ -d runtime-assets ] && [ -n "$(ls -A runtime-assets 2>/dev/null)" ]; then
            rsync -av runtime-assets/ hf-space/runtime-assets/
          elif [ -f web/mi-gente-sountec-live-edit.mp3 ]; then
            rsync -av web/mi-gente-sountec-live-edit.mp3 hf-space/runtime-assets/
          fi
          if [ -f web/driver_drowsiness_model.keras ]; then
            rsync -av web/driver_drowsiness_model.keras hf-space/runtime-assets/
          fi
          if [ -f web/driver.db ]; then
            rsync -av web/driver.db hf-space/runtime-assets/
          fi
          if [ -f web/.gitattributes ]; then
            rsync -av web/.gitattributes hf-space/
          fi
          if [ -f web/README-DOCKER.md ]; then
            cp web/README-DOCKER.md hf-space/README.md
          fi

          for asset in driver_drowsiness_model.keras mi-gente-sountec-live-edit.mp3 driver.db; do
            if [ -f "hf-space/${asset}" ] && [ ! -f "hf-space/runtime-assets/${asset}" ]; then
              mv "hf-space/${asset}" "hf-space/runtime-assets/${asset}"
            fi
          done

      - name: Commit and push to Hugging Face
        working-directory: hf-space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"github_sha":"%s","github_ref":"%s","synced_at":"%s","source":"github-actions"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .hf-sync-meta.json
          git add -A
          if git diff --staged --quiet; then
            echo "::warning::No file changes after sync; this should not happen."
            exit 1
          fi
          git commit -m "chore: sync Docker Space from GitHub ${GITHUB_SHA}"
          git push "https://ArnavPoswal15:${HF_TOKEN}@huggingface.co/spaces/ArnavPoswal15/FocusFleet" main
